<style>
        body {

<body>
<!-- Bottom Sheet Container -->
<div class="bottom-sheet bg-surface rounded-t-xl px-margin-mobile pb-stack-md pt-unit relative flex flex-col shadow-[0_-4px_24px_rgba(0,0,0,0.1)]">
<!-- Drag Handle -->
<div class="w-full flex justify-center mb-stack-sm">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="mb-stack-md">
<h2 class="font-body-md text-body-md font-bold text-on-surface">¿En cuánto vendes este producto?</h2>
</div>
<!-- Product Chip -->
<div class="bg-surface-container-low border border-outline-variant rounded-lg p-unit flex items-center mb-stack-md">
<span class="material-symbols-outlined text-outline mr-2 text-[20px]" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
<span class="font-caption text-caption text-on-surface-variant font-medium">Coca-Cola 600ml · $15.50 en Tuali</span>
</div>
<!-- Input Section -->
<div class="mb-stack-md">
<label class="block font-caption text-caption text-on-surface-variant mb-2" for="price-input">Tu precio de venta</label>
<div class="relative flex items-center bg-surface-container-lowest border-2 border-outline-variant rounded-lg h-[56px] px-4 transition-colors focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20">
<span class="font-headline-md text-headline-md text-on-surface-variant mr-2">$</span>
<input class="large-input w-full bg-transparent border-none p-0 font-headline-md text-headline-md text-on-surface focus:ring-0" id="price-input" placeholder="0.00" step="0.50" type="number" value="20"/>
</div>
</div>
<!-- Result Statement -->
<div class="mb-stack-sm text-center">
<p class="font-body-md text-body-md text-on-surface-variant mb-1">Con ese precio ganarías:</p>
<p class="font-headline-lg-mobile text-headline-lg-mobile text-[#15803d]"> <!-- Using a standard green since secondary green isn't specifically defined in the warm palette, blending with the warm tone -->
                $4.50 por unidad
            </p>
</div>
<!-- Note -->
<div class="mb-stack-lg text-center">
<p class="font-caption text-[12px] leading-[16px] text-outline">Solo se usa para calcular tu ganancia. No se guarda.</p>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4 mt-auto">
<button class="w-full h-[56px] bg-primary text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center shadow-[0_4px_12px_rgba(157,67,0,0.1)] active:scale-[0.98] transition-transform">
                Ver mi ganancia estimada
            </button>
<button class="w-full h-[48px] bg-transparent text-primary font-label-md text-label-md rounded-lg flex items-center justify-center active:bg-surface-variant transition-colors">
                Calcular después
            </button>
</div>
</div>
<script>
        // Simple micro-interaction for input formatting
        const input = document.getElementById('price-input');
        input.addEventListener('blur', function() {
            if(this.value) {
                this.value = parseFloat(this.value).toFixed(2);
            }
        });
    </script>
