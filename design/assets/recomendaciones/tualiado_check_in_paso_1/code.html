<style>
        .option-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-card:active {
            transform: scale(0.98);
        }
        .option-card.selected {
            border-color: #9d4300;
            background-color: #ffdbca;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top App Bar (Custom Implementation as per task instructions for Check-in Screen) -->
<header class="w-full top-0 bg-background flex justify-center items-center px-margin-mobile py-6 max-w-container-max mx-auto">
<div class="flex flex-col items-center gap-2">
<span class="font-label-md text-label-md text-on-surface-variant">1 de 3</span>
<div class="flex gap-2">
<div class="w-8 h-1.5 rounded-full bg-primary"></div>
<div class="w-2 h-1.5 rounded-full bg-outline-variant"></div>
<div class="w-2 h-1.5 rounded-full bg-outline-variant"></div>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow px-margin-mobile flex flex-col items-center max-w-md mx-auto w-full pt-stack-md">
<!-- Illustration / Mood Header -->
<div class="mb-stack-lg w-full">
<div class="relative w-full aspect-video rounded-3xl overflow-hidden mb-stack-md border border-outline-variant">
<img alt="Tienda familiar" class="w-full h-full object-cover" data-alt="A warm and inviting photograph of a small family-owned corner shop in a sunny neighborhood. The interior is clean and organized with wooden shelves filled with local products. Soft morning sunlight streams through the window, creating a peaceful and humble atmosphere. The colors are dominated by earthy tones and soft oranges, reflecting a trusted neighbor brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCE4ecitSKt1LcmW-ITv9gS4DZo7FwgIygEcA4o2CegfDxbE5Pam_g6P-naODUXmzreLXL5UrFfha26m4DE2QwUsl9IUFoaBr631X8KbP1_H2CLiwf9sR6JtiP34_pDHxPhbaLphUSSHvnEHpMGHgeQb-9xxIyfoefTXJE2kB5-aB1F2qHx8j8XU5bAlZyFoDQwdixsrrATaiWSTmgkgs2aF3fE3HiiWFE7lQfZFx_nFJpMOL3VoLTe_fgkhzMawD60xksosRR3YPY"/>
</div>
<div class="text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2 px-2">¿Cómo estuvo el día en tu tienda?</h1>
<p class="font-caption text-caption text-on-secondary-container">Toca una opción</p>
</div>
</div>
<!-- Options Container -->
<div class="w-full flex flex-col gap-4 mb-stack-lg">
<!-- Option: Muy bien -->
<button class="option-card w-full h-[72px] bg-surface-container-lowest border border-[#E7E5E4] rounded-2xl flex items-center px-6 gap-4 text-left shadow-sm" onclick="selectOption(this)">
<span class="text-[32px]">😊</span>
<span class="font-label-md text-label-md text-on-surface font-bold">Muy bien</span>
<div class="ml-auto opacity-0 check-icon">
<span class="material-symbols-outlined text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Option: Regular -->
<button class="option-card w-full h-[72px] bg-surface-container-lowest border border-[#E7E5E4] rounded-2xl flex items-center px-6 gap-4 text-left shadow-sm" onclick="selectOption(this)">
<span class="text-[32px]">😐</span>
<span class="font-label-md text-label-md text-on-surface font-bold">Regular</span>
<div class="ml-auto opacity-0 check-icon">
<span class="material-symbols-outlined text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Option: Mal -->
<button class="option-card w-full h-[72px] bg-surface-container-lowest border border-[#E7E5E4] rounded-2xl flex items-center px-6 gap-4 text-left shadow-sm" onclick="selectOption(this)">
<span class="text-[32px]">😞</span>
<span class="font-label-md text-label-md text-on-surface font-bold">Mal</span>
<div class="ml-auto opacity-0 check-icon">
<span class="material-symbols-outlined text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
</div>
<!-- Help/Support Anchor -->
<div class="mt-auto py-8 text-center flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="help_outline">help_outline</span>
<p class="font-caption text-caption text-on-surface-variant">Tus respuestas nos ayudan a darte <br/> mejores consejos para tu negocio.</p>
</div>
</main>
<script>
        function selectOption(element) {
            // Remove selection from all cards
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('selected', 'border-primary', 'bg-primary-fixed');
                card.classList.add('bg-surface-container-lowest', 'border-[#E7E5E4]');
                card.querySelector('.check-icon').classList.add('opacity-0');
            });

            // Add selection to clicked card
            element.classList.add('selected', 'border-primary', 'bg-primary-fixed');
            element.classList.remove('bg-surface-container-lowest', 'border-[#E7E5E4]');
            element.querySelector('.check-icon').classList.remove('opacity-0');

            // Simulate navigation after choice
            setTimeout(() => {
                console.log('Proceeding to Step 2...');
                // In a real app: window.location.href = 'step2.html';
            }, 600);
        }
    </script>
