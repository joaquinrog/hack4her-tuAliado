<!DOCTYPE html><html lang="es" style=""><head>

                    "primary-fixed-dim": "#ffb690",
                    "on-tertiary": "#ffffff",
                    "secondary-fixed": "#eae1da",
                    "on-primary": "#ffffff",
                    "surface": "#fff8f5",
                    "secondary-fixed-dim": "#cec5bf",
                    "on-secondary": "#ffffff",
                    "on-secondary-container": "#6a635e",
                    "surface-variant": "#e9e1dd",
                    "tertiary": "#006398",
                    "surface-container-low": "#faf2ee",
                    "surface-container-high": "#eee7e3",
                    "on-tertiary-fixed": "#001d32",

                    "on-secondary-fixed": "#1f1b17",

            },
            "fontFamily": {

                    "label-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "600"}]

          },
        },
      }
    </script>
<style>
        body {
            background-color: #fff8f5;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-selection-si {
            background-color: #f97316 !important;
            color: white !important;
            border-color: #f97316 !important;
            transform: scale(0.98);
        }
        .active-selection-no {
            background-color: #e9e1dd !important;
            color: #1e1b19 !important;
            border-color: #8c7164 !important;
            transform: scale(0.98);
        }
    </style>
</head>
<body class="font-body-md text-on-background min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="w-full top-0 bg-background flex justify-between items-center px-margin-mobile py-4 max-w-container-max mx-auto z-40">
<button aria-label="Volver" class="w-12 h-12 flex items-center justify-start text-primary transition-transform active:scale-90">
<span class="material-symbols-outlined text-[28px]">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="font-label-md text-label-md text-on-surface-variant">Paso 3 de 3</span>
<div class="flex gap-1 mt-1">
<div class="h-1.5 w-4 rounded-full bg-primary-fixed"></div>
<div class="h-1.5 w-4 rounded-full bg-primary-fixed"></div>
<div class="h-1.5 w-8 rounded-full bg-primary"></div>
</div>
</div>
<div class="w-12"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile py-stack-lg max-w-container-max mx-auto text-center">
<!-- Illustration / Mood Area -->
<div class="mb-stack-md relative">
<div class="absolute inset-0 bg-primary-fixed opacity-20 blur-3xl rounded-full"></div>
<img alt="Dueño de negocio revisando inventario" class="w-48 h-48 object-cover rounded-full border-4 border-white shadow-sm relative z-10 mx-auto" data-alt="A warm, tactile photograph of a small business owner in a modern, brightly lit boutique environment. They are smiling thoughtfully while checking wooden shelves with artisanal products. The lighting is soft and natural, emphasizing a light-mode aesthetic with clean white surfaces and warm wood accents. The overall mood is expert, humble, and encouraging, capturing a human-centric moment of business growth." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBAya6Xs-5dOL7MqLr4i9NhzuZj5NDkmnD1qkL2iukvJ2UoSjaAG23lTOGC5jOT59J-WYetvze3x-pWVwI9OGRhc5eRXUt6B5IdcQ4IPe2AYyHnUV36nXaJ4o8uSp0paYdKCtC_iw4HYNsdeyE4EPzIFMK_IfniHCBlEE51Y_VObN_xIscHXCCq20SJq5Rswvm3hjcZ-Q1xxTMdoGKP1f569l1N7MQSqzcUy87mUCvXkzOnDXurpD6rt6Xdb03HXakSqfIaPrU1XPc">
</div>
<!-- Question Section -->
<section class="max-w-xs mx-auto mb-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm">
                ¿Te pidieron algo que no tenías?
            </h1>
<p class="font-body-md text-body-md text-on-secondary-container">
                Conocer lo que tus clientes buscan te ayuda a vender más mañana.
            </p>
</section>
<!-- Action Buttons -->
<div class="flex gap-4 w-full justify-center">
<button class="w-[160px] h-20 flex flex-col items-center justify-center bg-white border border-outline-variant rounded-xl transition-all duration-200 active:scale-95 shadow-sm hover:border-primary group" id="btn-si" onclick="selectOption('si')">
<span class="material-symbols-outlined text-[32px] mb-1 group-[.active-selection-si]:fill-1" style="font-variation-settings: 'FILL' 0;">check_circle</span>
<span class="font-label-md text-label-md">Sí</span>
</button>
<button class="w-[160px] h-20 flex flex-col items-center justify-center bg-white border border-outline-variant rounded-xl transition-all duration-200 active:scale-95 shadow-sm hover:border-secondary group" id="id-no" onclick="selectOption('no')">
<span class="material-symbols-outlined text-[32px] mb-1" style="font-variation-settings: 'FILL' 0;">cancel</span>
<span class="font-label-md text-label-md">No</span>
</button>
</div>
</main>
<!-- Contextual FAB / Footer Action -->
<footer class="p-margin-mobile max-w-container-max mx-auto w-full mb-20 md:mb-8">
<button class="w-full bg-primary-fixed text-on-primary-fixed opacity-50 cursor-not-allowed py-4 rounded-xl font-headline-md text-headline-md shadow-sm transition-all duration-200" disabled="" id="next-button">
            Finalizar Check-in
        </button>
</footer>
<!-- Bottom Navigation Bar (Shell) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-16 bg-surface px-4 border-t border-outline-variant shadow-md">
<a class="flex flex-col items-center justify-center text-on-secondary-container hover:bg-secondary-container transition-all px-4 py-1" href="#">
<span class="material-symbols-outlined">analytics</span>
<span class="font-label-md text-[12px]">Progreso</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-all" href="#">
<span class="material-symbols-outlined">edit_note</span>
<span class="font-label-md text-[12px]">Check-in</span>
</a>
<a class="flex flex-col items-center justify-center text-on-secondary-container hover:bg-secondary-container transition-all px-4 py-1" href="#">
<span class="material-symbols-outlined">lightbulb</span>
<span class="font-label-md text-[12px]">Consejos</span>
</a>
<a class="flex flex-col items-center justify-center text-on-secondary-container hover:bg-secondary-container transition-all px-4 py-1" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-md text-[12px]">Perfil</span>
</a>
</nav>
<script>
        function selectOption(option) {
            const btnSi = document.getElementById('btn-si');
            const btnNo = document.getElementById('id-no');
            const nextBtn = document.getElementById('next-button');

            // Reset states
            btnSi.classList.remove('active-selection-si');
            btnNo.classList.remove('active-selection-no');

            // Set active state
            if (option === 'si') {
                btnSi.classList.add('active-selection-si');
            } else {
                btnNo.classList.add('active-selection-no');
            }

            // Enable finish button
            nextBtn.disabled = false;
            nextBtn.classList.remove('bg-primary-fixed', 'text-on-primary-fixed', 'opacity-50', 'cursor-not-allowed');
            nextBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'opacity-100', 'active:scale-95');
        }
    </script>


</body></html>
